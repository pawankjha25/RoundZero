          pass
    test_cases:
      - name: has_duplicate
        input: "[[1, 2, 3, 1]]"
        expected_output: "true"
      - name: all_distinct
        input: "[[1, 2, 3, 4]]"
        expected_output: "false"
      - name: many_duplicates
        input: "[[1, 1, 1, 3, 3, 4, 3, 2, 4, 2]]"
        expected_output: "true"
    seed_probes:
      - "What's the trade-off between the hash-set approach and sorting first?"
      - "How would your answer change under a strict memory budget that ruled out a hash set?"
      - "How would you adapt this to report which values were duplicated, not just whether any were?"

