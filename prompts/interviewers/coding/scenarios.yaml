version: 1
round_type: coding

scenarios:
  - id: two_sum
    level: [senior, staff, principal]
    title: "Two Sum"
    prompt: >
      Given an array of integers nums and an integer target, return the indices of the
      two numbers such that they add up to target. Assume exactly one valid answer
      exists and the same element may not be used twice.
    constraints:
      - "2 <= nums.length <= 10^4"
      - "Exactly one valid answer exists."
      - "You may not use the same element twice."
    entry_point: two_sum
    starter_code_python: |
      def two_sum(nums, target):
          # Return indices of the two numbers that add up to target.
          pass
    test_cases:
      - name: example_1
        input: "[[2, 7, 11, 15], 9]"
        expected_output: "[0, 1]"
      - name: example_2
        input: "[[3, 2, 4], 6]"
        expected_output: "[1, 2]"
      - name: example_3
        input: "[[3, 3], 6]"
        expected_output: "[0, 1]"
    seed_probes:
      - "Your first pass was brute force - what's the time complexity, and can you get it down to O(n)?"
      - "What would you do differently if nums were already sorted?"
      - "How would this change if the array were too large to fit in memory?"

  - id: valid_parentheses
    level: [senior, staff, principal]
    title: "Valid Parentheses"
    prompt: >
      Given a string containing just the characters '(', ')', '{', '}', '[' and ']',
      determine if the input string is valid: every open bracket must be closed by the
      same type of bracket, and in the correct order.
    constraints:
      - "1 <= s.length <= 10^4 (empty string is treated as valid)"
      - "s consists only of bracket characters."
    entry_point: is_valid
    starter_code_python: |
      def is_valid(s):
          # Return True if the brackets in s are balanced and correctly nested.
          pass
    test_cases:
      - name: example_1
        input: "[\"()[]{}\"]"
        expected_output: "true"
      - name: example_2
        input: "[\"(]\"]"
        expected_output: "false"
      - name: example_3
        input: "[\"([)]\"]"
        expected_output: "false"
      - name: empty_string
        input: "[\"\"]"
        expected_output: "true"
    seed_probes:
      - "Why does a stack fit this problem better than, say, counting open/close characters?"
      - "What's the space complexity, and can it ever be better than O(n)?"
      - "How would you extend this to also validate a custom bracket pair like '<>'?"

  - id: best_time_to_buy_sell_stock
    level: [senior, staff, principal]
    title: "Best Time to Buy and Sell Stock"
    prompt: >
      Given an array where prices[i] is the price of a stock on day i, find the maximum
      profit from buying on one day and selling on a later day. If no profit is
      possible, return 0.
    constraints:
      - "1 <= prices.length <= 10^5"
      - "Exactly one buy and one sell (or none)."
    entry_point: max_profit
    starter_code_python: |
      def max_profit(prices):
          # Return the maximum achievable profit from one buy and one later sell.
          pass
    test_cases:
      - name: example_1
        input: "[[7, 1, 5, 3, 6, 4]]"
        expected_output: "5"
      - name: monotonic_decreasing
        input: "[[7, 6, 4, 3, 1]]"
        expected_output: "0"
      - name: two_days
        input: "[[1, 2]]"
        expected_output: "1"
    seed_probes:
      - "What's the brute-force complexity here, and how did you get to a single pass?"
      - "How would the problem change if you were allowed multiple buy/sell transactions?"
      - "What if prices arrived as a live stream instead of a fixed array?"

  - id: maximum_subarray
    level: [staff, principal]
    title: "Maximum Subarray"
    prompt: >
      Given an integer array nums, find the contiguous subarray (containing at least
      one number) with the largest sum, and return that sum.
    constraints:
      - "1 <= nums.length <= 10^5"
      - "Array may contain negative numbers."
    entry_point: max_subarray
    starter_code_python: |
