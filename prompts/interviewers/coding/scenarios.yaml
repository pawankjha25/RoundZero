      uppercase letters to lowercase and removing all non-alphanumeric characters,
      and false otherwise.
    constraints:
      - "1 <= s.length <= 2 * 10^5"
      - "s consists of printable ASCII characters."
    entry_point: is_palindrome
    starter_code_python: |
      def is_palindrome(s):
