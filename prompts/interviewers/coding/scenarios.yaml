    test_cases:
      - name: example_1
        input: "[[3, 0, 1]]"
        expected_output: "2"
      - name: example_2
        input: "[[0, 1]]"
        expected_output: "2"
      - name: example_3
        input: "[[9, 6, 4, 2, 3, 5, 7, 0, 1]]"
