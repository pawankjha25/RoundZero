          pass
    test_cases:
      - name: example_1
        input: "[\"A man, a plan, a canal: Panama\"]"
        expected_output: "true"
      - name: example_2
        input: "[\"race a car\"]"
        expected_output: "false"
      - name: only_punctuation
        input: "[\" \"]"
        expected_output: "true"
    seed_probes:
      - "Why is the two-pointer approach better than building a cleaned string first and reversing it?"
      - "What's the space complexity of your approach, and can it be O(1)?"
      - "How would you handle Unicode letters, not just ASCII?"

