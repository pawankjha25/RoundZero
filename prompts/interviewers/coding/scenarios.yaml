          pass
    test_cases:
      - name: example_1
        input: "[[-2, 1, -3, 4, -1, 2, 1, -5, 4]]"
        expected_output: "6"
      - name: single_element
        input: "[[1]]"
        expected_output: "1"
      - name: all_positive
        input: "[[5, 4, -1, 7, 8]]"
        expected_output: "23"
    seed_probes:
      - "Walk me through why Kadane's algorithm works - what invariant are you maintaining at each step?"
      - "How would you also return the actual subarray, not just its sum?"
      - "Can this be solved with divide and conquer instead? What's the complexity trade-off?"

  - id: reverse_integer
    level: [senior, staff]
    title: "Reverse Integer"
    prompt: >
      Given a signed 32-bit integer x, return x with its digits reversed. If reversing
      x causes the value to go outside the signed 32-bit integer range
      [-2^31, 2^31 - 1], return 0.
    constraints:
      - "-2^31 <= x <= 2^31 - 1"
    entry_point: reverse_integer
    starter_code_python: |
      def reverse_integer(x):
          # Return x with digits reversed, or 0 on 32-bit signed overflow.
          pass
    test_cases:
      - name: positive
        input: "[123]"
        expected_output: "321"
      - name: negative
        input: "[-123]"
        expected_output: "-321"
      - name: trailing_zero
        input: "[120]"
        expected_output: "21"
      - name: overflow
        input: "[1534236469]"
        expected_output: "0"
    seed_probes:
      - "Python integers don't overflow the way a 32-bit int does - how do you actually detect the overflow case?"
      - "What would you need to change to solve this without ever converting to a string?"
      - "How would you handle this in a language with fixed-width integers, like Java or C++?"

