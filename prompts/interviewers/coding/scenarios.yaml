    test_cases:
      - name: n_equals_2
        input: "[2]"
        expected_output: "2"
      - name: n_equals_3
        input: "[3]"
        expected_output: "3"
      - name: n_equals_5
        input: "[5]"
        expected_output: "8"
    seed_probes:
      - "This is structurally the same recurrence as another famous problem - which one, and why?"
      - "Your first version was recursive - what happens to its complexity without memoization, and why?"
      - "Can you get this down to O(1) space? Walk me through how."

  - id: binary_search
    level: [senior, staff, principal]
